services:
  - type: web
    name: nutrition-tracker
    env: node
    region: frankfurt
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: sh -c 'npx prisma migrate deploy || true && npm start'
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        value: https://nutrition-tracker-yourusername.onrender.com
      - key: DEFAULT_LOCALE
        value: en
    autoDeploy: true